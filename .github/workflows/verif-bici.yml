# Plantilla de CI para un proyecto Node.js con pruebas (npm test) y Dockerfile
# Dónde va: en TU repositorio, en .github/workflows/ci.yml
#   (si usas un proyecto del curso en tu fork: .github/workflows/<nombre-del-proyecto>.yml)
# Cambia lo que dice CAMBIA. Si todavía no tienes "npm test", usa ci-docker.yml.

name: Verificación · bici-barrio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CAMBIA: la carpeta donde está tu Dockerfile.
#   "."                          si está en la raíz de tu repositorio
#   "proyectos/mercado-raices"   si usas un proyecto del curso en tu fork
defaults:
  run:
    working-directory: "proyectos/bici-barrio"

env:
  # CAMBIA: el puerto de tu aplicación dentro del contenedor (normalmente 3000)
  PUERTO_APP: "3000"

jobs:
  pruebas:
    name: Pruebas del código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # npm ci necesita package-lock.json; si no lo tienes, cambia por: npm install
      - run: npm ci
      - run: npm test

  imagen:
    name: Imagen y prueba de humo
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t mi-proyecto:${{ github.sha }} .
      - run: docker run -d -p 9000:${{ env.PUERTO_APP }} --name app mi-proyecto:${{ github.sha }}
      - name: Esperar a que responda
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && exit 0
            sleep 1
          done
          exit 1
      - name: "Prueba 1 · CAMBIA: escribe aquí tu frase"
        run: |
          # CAMBIA: la ruta y el texto que debe aparecer
          curl -s http://localhost:9000/estaciones | tee respuesta.txt
          grep -q "Biblioteca" respuesta.txt
      - name: Logs del contenedor (si algo falló)
        if: failure()
        run: docker logs app
