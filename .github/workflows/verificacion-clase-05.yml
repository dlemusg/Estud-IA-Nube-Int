name: Verificación · clase 5
on:
  push:
    branches: [verificacion-clase-05]
permissions:
  contents: read
jobs:
  persistencia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clases/clase-05/infra-local
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.17.0"
          terraform_wrapper: false
      - run: |
          set -x
          P=proyectos/villa-nube.tfvars
          terraform init -input=false
          terraform workspace new desarrollo
          terraform apply -auto-approve -var-file=$P -var-file=entornos/desarrollo.tfvars
          out=$(URL=http://localhost:8081 bash ../../clase-04/villa-nube/scripts/verificar.sh); echo "$out"
          id=$(echo "$out" | grep -o 'id [0-9a-f-]*' | head -1 | cut -d' ' -f2); echo "ID=$id"
          sed -i 's/"90"/"30"/' $P
          terraform apply -auto-approve -var-file=$P -var-file=entornos/desarrollo.tfvars
          sleep 8
          curl -s -w "\nHTTP %{http_code}\n" http://localhost:8081/solicitudes/$id
          docker inspect villa-nube-desarrollo --format '{{.Config.Env}}'
          terraform workspace new pruebas
          terraform plan -var-file=$P -var-file=entornos/desarrollo.tfvars || echo "GUARDIA OK"
